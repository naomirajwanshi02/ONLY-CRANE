<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Crane</title>
<style>
  :root {
    --page: #ecdfc6; --ink: #2b1e13; --text: #5b4630; --muted: #8f7a5e;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "JetBrains Mono", monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #e6d7bb; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%;

  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .cap { position: absolute; left: 90px; right: 90px; text-align: center; will-change: transform, opacity; }
  .step { top: 330px; font: 500 28px/1 var(--mono); letter-spacing: .04em; color: var(--muted); }
  .instr { top: 382px; font: 600 54px/1.18 var(--sans); color: var(--ink); letter-spacing: -0.005em; text-wrap: balance; }
  .note { top: 1350px; font: 400 38px/1.3 var(--sans); color: var(--text); text-wrap: balance; }
  #flip { position: absolute; left: 540px; top: 1300px; width: 120px; height: 120px; opacity: 0; transform: translate(-50%, -50%); }
  #hit { position: absolute; inset: 0; cursor: pointer; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .25s; }
  #bar:hover { opacity: 1; }
  #scrub { width: 900px; accent-color: #8f7a5e; }
  body.capture #bar { display: none; }
</style>
</head>

    <path d="M24 60a36 36 0 1 1 10.5 25.5" fill="none" stroke="#2a1d10" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 88l12.5-2.5-2.5-12.5" fill="none" stroke="#2a1d10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="cap note" id="noteB"></div><div class="cap note" id="noteA"></div>
  <div id="hit"></div>
  <div id="bar"><input id="scrub" type="range" min="0" step="0.01" value="0"></div>
</div>
